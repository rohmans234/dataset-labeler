services:
  # Layanan Web App (Next.js)
  labelflow-web:
    build:
      context: ./datasetLabeler  # Pastikan huruf besar/kecil sesuai dengan nama folder asli
      dockerfile: Dockerfile
    container_name: labelflow_app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: always

  # Layanan n8n
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_workflow
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    restart: always